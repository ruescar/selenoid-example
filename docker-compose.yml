version: '3'
services:
  selenoid:
    container_name: "selenoid"
    image: "aerokube/selenoid:latest-release"
    network_mode: bridge
    volumes:
      - "$PWD:/etc/selenoid/" # assumed current dir contains browsers.json
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "$PWD/video:/opt/selenoid/video"
      - "$PWD/logs:/opt/selenoid/logs"
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=$PWD/video  
    command: ["-conf", "/etc/selenoid/browsers.json", "-video-recorder-image",
     "selenoid/video-recorder:latest-release", "-video-output-dir", "/opt/selenoid/video",
     "-log-output-dir", "/opt/selenoid/logs", "-limit", "4"]
    ports:
      - "4444:4444"  
  selenoid-ui:
    container_name: "selenoid-ui"
    image: "aerokube/selenoid-ui:latest-release"
    network_mode: bridge
    links:
      - selenoid
    command: ["--selenoid-uri", "http://selenoid:4444"]  
    ports:
      - "8081:8080"
